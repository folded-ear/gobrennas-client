    preferences(deviceKey: String): [UserPreference!]!
    provider: String!
    roles: [String!]!
}

type UserDevice implements Node {
    createdAt: DateTime!
    id: ID!
    key: String!
    lastEnsuredAt: DateTime!
    name: String!
    preferences: [UserPreference!]!
    user: User!
}

type UserPreference {
    device: UserDevice
    name: String!
    type: DataType!
    user: User!
    value: String
}

enum AccessLevel {
    ADMINISTER
    CHANGE
    VIEW
}

enum ChronoUnit {
    HOURS
    MILLIS
    MINUTES
    SECONDS
}

"""

A suggestion for how to interpret the always-a-String value of a preference.
Clients should be "generous" in their parsing, where possible. E.g, `BOOLEAN`
strings `"123"` and `"0"` should be treated as `true` and `false`, respectively.
"""
enum DataType {
    BOOLEAN
    FLOAT
    "A string with ID semantics"
    ID
    INT
    "Arbitrary JSON-serialized data"
    JSON
    "A JSON-serialized list of ID values"
    SET_OF_IDS
    STRING
}

enum LibrarySearchScope {
    EVERYONE
    MINE
}

enum PlanBucketSort {
    "Undated buckets first, then by date. Ties are broken by position."
    DATE
    """

    Unnamed buckets first, then by name, ignoring case. Ties are broken
    by position.
    """
    NAME
    "The order buckets were created in, adjusted by any moves."
    POSITION
}

enum PlanItemStatus {
    ACQUIRED
    COMPLETED
    DELETED
    NEEDED
}

enum Rating {
    FIVE_STARS
    FOUR_STARS
    ONE_STAR
    THREE_STARS
    TWO_STARS
}

enum RecognitionKind {
    PANTRY_ITEM
    RECIPE
    SECTION
}

enum RecognizedRangeType {
    ITEM
    NEW_ITEM
    NEW_UNIT
    QUANTITY
    UNIT
    UNKNOWN
}

enum SortDir {
    ASC
    DESC
}

"The type of a cursor, an opaque string used for walking connections"
scalar Cursor

"An RFC-3339 compliant Full Date Scalar"
scalar Date

"A slightly refined version of RFC-3339 compliant DateTime Scalar"
scalar DateTime

"A 64-bit signed integer"
scalar Long

"An Float scalar that must be greater than or equal to zero"
scalar NonNegativeFloat

"An Int scalar that must be greater than or equal to zero"
scalar NonNegativeInt

"An Int scalar that must be a positive value"
scalar PositiveInt

input IngredientInfo {
    calories: Int
    directions: String
    externalUrl: String
    id: ID
    ingredients: [IngredientRefInfo!]
    labels: [String!]
    name: String!
    "Filename of a scratch upload to set as this recipe's photo."
    photo: String
    """

    The photo's focal point, as `[left, top]`. Ignored unless exactly two
    elements are supplied.
    """
    photoFocus: [Float!]
    sections: [SectionInfo!]
    storeOrder: Int
    """

    Total time to make the recipe, in milliseconds. Note that
    `Recipe.totalTime` returns minutes by default.
    """
    totalTime: Int
    type: String!
    yield: Int
}

input IngredientRefInfo {
    ingredient: String
    ingredientId: ID
    preparation: String
    quantity: Float
    raw: String!
    units: String
    uomId: ID
}

input LibrarySearch {
    "Cursor to find results after. Omit to retrieve the first page."
    after: Cursor
    "How many results to return. If not specified, 10 will be returned."
    first: NonNegativeInt! = 10
    """

    Only return results which include at least one of these ingredients. An
    empty list means "unconstrained".
    """
    ingredients: [ID!]! = []
    """

    The textual query to filter results by. Can include simple words, as
    well as quoted phrases.
    """
    query: String! = ""
    "The scope to search within, 'only mine' by default."
    scope: LibrarySearchScope! = MINE
}

input MutatePlanTree {
    """

    Optional ID to move the plan items after w/in the parent. If null, they
    will be placed first (i.e., after nothing).
    """
    afterId: ID
    "IDs of plan items to move."
    ids: [ID!]!
    "ID of the item to move under (if not already under)."
    parentId: ID!
}

input PantrySearch {
    """

    Cursor to find results after. This should be omitted to retrieve the
    first page.
    """
    after: Cursor
    """

    How many items to return in the connection. If not specified, 25 will be
    returned.
    """
    first: NonNegativeInt! = 25
    """

    Textual query to filter items by. The exact query operation performed
    is unspecified, except that 'duplicates:12345' will return auto-detected
    duplicates of the item with id '12345'. Exactly what "duplicate" means
    is unspecified and subject to change, excepting that it will remain
    consistent with results' "duplicateCount".
    """
    query: String
    """

    Field to sort the result by. If omitted, the sort will be stable, but
    is otherwise unspecified.
    """
    sortBy: String
    "Direction to sort the result, ascending by default."
    sortDir: SortDir = ASC
}

input RecognitionChoice {
    end: NonNegativeInt!
    id: ID!
    start: NonNegativeInt!
}

input SectionInfo {
    directions: String
    """

    Id of the section, owned or by reference. Unsaved owned sections have
    null. By reference sections will have no other fields populated.
    """
    id: ID
    ingredients: [IngredientRefInfo!]
    labels: [String!]
    name: String
}

input SuggestionSearch {
    "Cursor to find results after. Omit to retrieve the first page."
    after: Cursor
    "How many results to return. If not specified, 5 will be returned."
    first: NonNegativeInt! = 5
}

input UnsavedBucket {
    date: Date
    name: String
}
